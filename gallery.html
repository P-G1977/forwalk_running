<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta tags for search engines -->
    <meta
      name="description"
      content="Forewalk Games - A running club for people who love games."
    />
    <meta
      name="keywords"
      content="Forewalk Games, games club, runners, UK, sport, exercise"
    />

    <!-- Page title -->
    <title>Forewalk Games | Gallery Page</title>

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <a href="index.html">
        <h1 id="logo">Forewalk Games</h1>
      </a>

      <input
        type="checkbox"
        id="nav-toggle"
        name="nav-toggle"
        aria-label="Toggle navigation"
      />

      <label for="nav-toggle" class="nav-toggle-label">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </label>

      <nav>
        <ul id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html" class="active">Gallery</a></li>
          <li><a href="signup.html">Sign Up</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Gallery section -->
      <section id="gallery">
        <div class="section-heading">
          <span class="eyebrow">Life at Forewalk Games</span>
          <h2>Moments Worth Sharing</h2>
          <p>
            From running adventures to board game nights, take a look at what
            makes our community special.
          </p>
        </div>

        <!-- Gallery images -->
        <div class="gallery-grid">
          <figure class="gallery-item">
            <img
              src="assets/images/running-1.webp"
              alt="A group of friends running through a park"
              width="503"
              height="506"
              loading="lazy"
            />
            <figcaption>Running Adventures</figcaption>
          </figure>

          <figure class="gallery-item">
            <img
              src="assets/images/games-1.webp"
              alt="Friends enjoying a board game together"
              width="504"
              height="507"
              loading="lazy"
            />
            <figcaption>Games Night</figcaption>
          </figure>

          <figure class="gallery-item">
            <img
              src="assets/images/social-1.webp"
              alt="Friends meeting for coffee and conversation"
              width="508"
              height="506"
              loading="lazy"
            />
            <figcaption>Social Meetups</figcaption>
          </figure>

          <figure class="gallery-item">
            <img
              src="assets/images/adventure-1.webp"
              alt="Friends on an adventure"
              width="507"
              height="509"
              loading="lazy"
            />
            <figcaption>Adventure Time</figcaption>
          </figure>

          <figure class="gallery-item">
            <img
              src="assets/images/running-2.webp"
              alt="Four runners jogging towards the camera on a woodland path"
              width="503"
              height="507"
              loading="lazy"
            />
            <figcaption>Running Adventures</figcaption>
          </figure>

          <figure class="gallery-item">
            <img
              src="assets/images/games-2.webp"
              alt="Friends enjoying a board game together"
              width="507"
              height="508"
              loading="lazy"
            />
            <figcaption>Games Night</figcaption>
          </figure>
        </div>

        <!-- Gallery lightbox -->
        <div
          id="lightbox"
          class="lightbox"
          role="dialog"
          aria-modal="true"
          aria-label="Gallery image viewer"
          hidden
        >
          <button
            id="lightbox-close"
            class="lightbox-close"
            type="button"
            aria-label="Close image viewer"
          >
            &times;
          </button>

          <img id="lightbox-image" src="" alt="" />

          <button
            id="lightbox-prev"
            class="lightbox-nav"
            type="button"
            aria-label="Previous image"
          >
            &#10094;
          </button>

          <img id="lightbox-image" src="" alt="" />

          <button
            id="lightbox-next"
            class="lightbox-nav"
            type="button"
            aria-label="Next image"
          >
            &#10095;
          </button>

          <span
            id="lightbox-counter"
            class="lightbox-counter"
            aria-live="polite"
          ></span>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <ul id="social-networks">
        <li>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in a new tab)"
          >
            <i class="fa-brands fa-facebook" aria-hidden="true"></i>
          </a>
        </li>

        <li>
          <a
            href="https://www.x.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our X page (opens in a new tab)"
          >
            <i class="fa-brands fa-square-x-twitter" aria-hidden="true"></i>
          </a>
        </li>

        <li>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our YouTube page (opens in a new tab)"
          >
            <i class="fa-brands fa-square-youtube" aria-hidden="true"></i>
          </a>
        </li>

        <li>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page (opens in a new tab)"
          >
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </footer>

    <!-- Font Awesome kit -->
    <script
      src="https://kit.fontawesome.com/d0511671cd.js"
      crossorigin="anonymous"
    ></script>

    <!--javascript-->
    <script src="assets/js/gallery.js"></script>
  </body>
</html>
