<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta tags for search engines -->
    <meta
      name="description"
      content="Forewalk Games - A running club for people who love games."
    />
    <meta
      name="keywords"
      content="Forewalk Games, games club, runners, UK, sport, exercise"
    />

    <!-- Page title -->
    <title>Member Login | Forewalk Games</title>

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <a href="index.html">
        <h1 id="logo">Forewalk Games</h1>
      </a>

      <input
        type="checkbox"
        id="nav-toggle"
        name="nav-toggle"
        aria-label="Toggle navigation"
      />

      <label for="nav-toggle" class="nav-toggle-label">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </label>

      <nav>
        <ul id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="signup.html" class="active">Sign Up</a></li>
        </ul>
      </nav>
    </header>

    <!-- Main content -->
    <main>
    <section id="members-dashboard" hidden>
        <h1>Member Dashboard</h1>

        <p>
            Welcome back,
            <strong id="member-name"></strong>!
        </p>

        <h2>Your Profile</h2>

        <p>
            Email: <span id="member-email"></span>
        </p>

        <h2>Your Events</h2>

        <p>
            Your upcoming Forewalk Games events
            will appear here.
        </p>

        <button id="logout-button" type="button">
            Log Out
        </button>
    </section>

    <p id="dashboard-message" role="status" aria-live="polite">
        Checking your session...
    </p>
</main>

    <!-- Footer -->
    <footer>
      <ul id="social-networks">
        <li>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Facebook page (opens in a new tab)"
          >
            <i class="fa-brands fa-facebook" aria-hidden="true"></i>
          </a>
        </li>

        <li>
          <a
            href="https://www.x.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our X page (opens in a new tab)"
          >
            <i class="fa-brands fa-square-x-twitter" aria-hidden="true"></i>
          </a>
        </li>

        <li>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our YouTube page (opens in a new tab)"
          >
            <i class="fa-brands fa-square-youtube" aria-hidden="true"></i>
          </a>
        </li>

        <li>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener"
            aria-label="Visit our Instagram page (opens in a new tab)"
          >
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </footer>

    <!-- Font Awesome kit -->
    <script
      src="https://kit.fontawesome.com/d0511671cd.js"
      crossorigin="anonymous"
    ></script>

    <script src="assets/js/members.js"></script>
  </body>
</html>
