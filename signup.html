
<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta tags for search engines -->
    <meta name="description" content="Forewalk Games - A running club for people who love games.">
    <meta name="keywords" content="Forewalk Games, games club, runners, UK, sport, exercise">

    <!-- Page title -->
    <title>Forewalk Games | Signup Page</title>

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="index.html">
            <h1 id="logo">Forewalk Games</h1>
        </a>

        <input type="checkbox" id="nav-toggle" name="nav-toggle" aria-label="Toggle navigation">

        <label for="nav-toggle" class="nav-toggle-label">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </label>

        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="signup.html" class="active">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content -->
    <main>
    <section id="signup">
        <div class="signup-container">

            <div class="section-heading">
                <span class="eyebrow">Join the Community</span>
                <h2>Become a Forewalker</h2>
                <p>Meet new people, get active and enjoy the games.</p>
            </div>

            <form id="signup-form">

                <div class="form-group">
                    <label for="full-name">Full name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        autocomplete="name"
                        placeholder="Your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="12"
                        required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        autocomplete="new-password"
                        minlength="12"
                        required>
                        <p id="password-error" class="form-error" role="alert" hidden></p>
                </div>

                <button type="submit" class="signup-button">
                    Create My Account
                </button>

            </form>
        </div>
    </section>
</main>


    <!-- Footer -->
    <footer>
        <ul id="social-networks">
            <li>
                <a href="https://www.facebook.com/"
                   target="_blank"
                   rel="noopener"
                   aria-label="Visit our Facebook page (opens in a new tab)">
                    <i class="fa-brands fa-facebook" aria-hidden="true"></i>
                </a>
            </li>

            <li>
                <a href="https://www.x.com/"
                   target="_blank"
                   rel="noopener"
                   aria-label="Visit our X page (opens in a new tab)">
                    <i class="fa-brands fa-square-x-twitter" aria-hidden="true"></i>
                </a>
            </li>

            <li>
                <a href="https://www.youtube.com/"
                   target="_blank"
                   rel="noopener"
                   aria-label="Visit our YouTube page (opens in a new tab)">
                    <i class="fa-brands fa-square-youtube" aria-hidden="true"></i>
                </a>
            </li>

            <li>
                <a href="https://www.instagram.com/"
                   target="_blank"
                   rel="noopener"
                   aria-label="Visit our Instagram page (opens in a new tab)">
                    <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                </a>
            </li>
        </ul>
    </footer>

    <!-- Font Awesome kit -->
    <script src="https://kit.fontawesome.com/d0511671cd.js"
            crossorigin="anonymous"></script>

            <script src="assets/js/signup.js"></script>

</body>
</html>
